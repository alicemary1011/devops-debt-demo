name: DevOps Debt Analysis

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops-debt-analyzer .

      - name: Run DevOps debt analyzer
        run: docker run --rm devops-debt-analyzer